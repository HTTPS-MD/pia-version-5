<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <script src="../js/shared/theme-boot.js"></script>
    <meta name="robots" content="noindex">
    <title>Page Not Found — PIA</title>

    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/auth/error.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16.png">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
</head>

<body>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.2 8.8-1.9 4.5-4.5 1.9 1.9-4.5 4.5-1.9Z"/></symbol>
            <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4"/><path d="m10 6-6 6 6 6"/></symbol>
        </defs>
    </svg>

    <div class="error-page">
        <div class="error-ambient" aria-hidden="true"></div>

        <main class="error-card">
            <div class="error-glyph">
                <svg class="icon icon-lg"><use href="#i-compass"></use></svg>
            </div>

            <p class="error-code">Error 404</p>
            <h1 class="error-title">We can't find that page</h1>
            <p class="error-lede">
                The link may be out of date, or the page may have moved. Nothing is
                wrong with your account — head back and carry on from there.
            </p>

            <div class="error-actions">
                <a class="btn btn-primary" href="../../index.html">
                    <svg class="icon"><use href="#i-arrow-left"></use></svg>
                    Back to sign in
                </a>
            </div>
        </main>
    </div>
</body>

</html>
