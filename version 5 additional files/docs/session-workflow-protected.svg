<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1700" width="1700" height="1700" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1700" height="1700" fill="#fff"/><rect x="160.0" y="28.0" width="340" height="44" rx="10" fill="#1b2a5c" stroke="#1b2a5c" stroke-width="2"/><text x="330" y="56" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">ADMIN</text><rect x="930.0" y="28.0" width="340" height="44" rx="10" fill="#1b2a5c" stroke="#1b2a5c" stroke-width="2"/><text x="1100" y="56" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">STUDENT</text><rect x="160.0" y="105.0" width="340" height="70" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="136" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">1. Start session</text><text x="330" y="157" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">(door opens, 120-minute timer)</text><path d="M500,140 L1100,140 L1100,190" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="800" y="130" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">door is open</text><path d="M330,175 L330,225" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="150.0" y="225.0" width="360" height="90" rx="10" fill="#e3efff" stroke="#e0a800" stroke-width="4"/><text x="330" y="256" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">2. Call the roll: mark Present</text><text x="330" y="277" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">or Absent for each student</text><text x="330" y="298" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">(or Mark all present, then fix)</text><circle cx="504.0" cy="231.0" r="14" fill="#e0a800"/><text x="504.0" y="237.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M330,315 L330,355" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="150.0" y="355.0" width="360" height="90" rx="10" fill="#e3efff" stroke="#e0a800" stroke-width="4"/><text x="330" y="386" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Watch the roster:</text><text x="330" y="407" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Present + In / Present, not in yet</text><text x="330" y="428" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Absent / Not marked</text><circle cx="504.0" cy="361.0" r="14" fill="#e0a800"/><text x="504.0" y="367.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M330,445 L330,505" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><polygon points="330,505.0 480.0,560 330,615.0 180.0,560" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="330" y="556" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">10 minutes left and</text><text x="330" y="577" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">class not done?</text><rect x="610.0" y="520.0" width="300" height="80" rx="10" fill="#ffe3e3" stroke="#e0a800" stroke-width="4"/><text x="760" y="556" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Banner: Extend +30 min</text><text x="760" y="577" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">or End now. Timer resets.</text><circle cx="904.0" cy="526.0" r="14" fill="#e0a800"/><text x="904.0" y="532.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M480,560 L610,560" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="545" y="550" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><path d="M330,615 L330,705" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="352" y="650" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><rect x="150.0" y="705.0" width="360" height="80" rx="10" fill="#f3f3f3" stroke="#888" stroke-width="2" stroke-dasharray="6 5"/><text x="330" y="741" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Keep watching. Late student?</text><text x="330" y="762" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Mark Present while live.</text><rect x="930.0" y="190.0" width="340" height="60" rx="10" fill="#dff5e3" stroke="#2e9d4f" stroke-width="2"/><text x="1100" y="216" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">3. Types 11-digit number</text><text x="1100" y="237" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">and confirms name</text><path d="M1100,250 L1100,290" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><polygon points="1100,290.0 1240.0,345 1100,400.0 960.0,345" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="1100" y="351" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Is the door open?</text><rect x="1380.0" y="310.0" width="240" height="70" rx="10" fill="#ffe3e3" stroke="#c0392b" stroke-width="2"/><text x="1500" y="341" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Not open yet.</text><text x="1500" y="362" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Wait for the admin.</text><path d="M1240,345 L1380,345" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1310" y="335" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><path d="M1100,400 L1100,445" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1122" y="428" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><polygon points="1100,445.0 1250.0,500 1100,555.0 950.0,500" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="1100" y="496" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Did the admin mark</text><text x="1100" y="517" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">this student Present?</text><rect x="1380.0" y="460.0" width="240" height="80" rx="10" fill="#ffe3e3" stroke="#c0392b" stroke-width="2"/><text x="1500" y="496" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Cannot enter yet.</text><text x="1500" y="517" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Tell the admin, then retry.</text><path d="M1250,500 L1380,500" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1315" y="490" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><path d="M510,270 L750,270 L750,500 L950,500" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="750" y="258" font-size="15" fill="#555" text-anchor="middle">admin marks</text><path d="M1100,555 L1100,595" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1122" y="580" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><polygon points="1100,595.0 1250.0,650 1100,705.0 950.0,650" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="1100" y="646" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Number already used</text><text x="1100" y="667" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">today?</text><rect x="1380.0" y="605.0" width="240" height="90" rx="10" fill="#ffe3e3" stroke="#e0a800" stroke-width="4"/><text x="1500" y="636" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Blocked. The admin sees it</text><text x="1500" y="657" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">on the row and taps</text><text x="1500" y="678" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Let back in.</text><circle cx="1614.0" cy="611.0" r="14" fill="#e0a800"/><text x="1614.0" y="617.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M1250,650 L1380,650" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1315" y="640" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><path d="M1500,695 L1500,790 L1270,790" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1380" y="815" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">admin lets back in</text><path d="M1100,705 L1100,755" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1122" y="735" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><rect x="930.0" y="755.0" width="340" height="70" rx="10" fill="#dff5e3" stroke="#2e9d4f" stroke-width="2"/><text x="1100" y="786" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">4. Enters the game</text><text x="1100" y="807" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">roster shows the student as In</text><path d="M1100,825 L1100,880 L330,880 L330,905" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="700" y="870" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">when class is done</text><rect x="170.0" y="905.0" width="320" height="60" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="941" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">5. End session</text><path d="M330,965 L330,1005" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><polygon points="330,1005.0 480.0,1060 330,1115.0 180.0,1060" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="330" y="1056" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Students still</text><text x="330" y="1077" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">playing?</text><rect x="590.0" y="1020.0" width="340" height="80" rx="10" fill="#ffe3e3" stroke="#e0a800" stroke-width="4"/><text x="760" y="1056" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Warning: 5 students are still</text><text x="760" y="1077" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">playing. They stay in. End anyway?</text><circle cx="924.0" cy="1026.0" r="14" fill="#e0a800"/><text x="924.0" y="1032.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M480,1060 L590,1060" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="535" y="1050" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><path d="M760,1100 L760,1140 L330,1140" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><path d="M330,1115 L330,1155" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="352" y="1127" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><polygon points="330,1155.0 480.0,1210 330,1265.0 180.0,1210" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="330" y="1206" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Stages (OCEAN, Tutor,</text><text x="330" y="1227" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Game) still open?</text><rect x="590.0" y="1170.0" width="340" height="80" rx="10" fill="#ffe3e3" stroke="#e0a800" stroke-width="4"/><text x="760" y="1206" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Ask: also close the</text><text x="760" y="1227" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">open stages?</text><circle cx="924.0" cy="1176.0" r="14" fill="#e0a800"/><text x="924.0" y="1182.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M480,1210 L590,1210" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="535" y="1200" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><path d="M760,1250 L760,1290 L330,1290" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><path d="M330,1265 L330,1310" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="352" y="1281" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><rect x="170.0" y="1310.0" width="320" height="60" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="1346" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Door closes</text><path d="M330,1370 L330,1420" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="120.0" y="1420.0" width="420" height="140" rx="10" fill="#e3efff" stroke="#e0a800" stroke-width="4"/><text x="330" y="1456" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Final record shows 4 results:</text><text x="330" y="1477" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Present and entered</text><text x="330" y="1498" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Present, never entered</text><text x="330" y="1519" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Absent (you marked)</text><text x="330" y="1540" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Not marked</text><circle cx="534.0" cy="1426.0" r="14" fill="#e0a800"/><text x="534.0" y="1432.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M330,1560 L330,1608" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="250.0" y="1608.0" width="160" height="44" rx="22.0" fill="#e8e8ee" stroke="#666" stroke-width="2"/><text x="330" y="1636" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="700">End</text><rect x="710.0" y="1440.0" width="380" height="100" rx="10" fill="#f3f3f3" stroke="#e0a800" stroke-width="4" stroke-dasharray="6 5"/><text x="900" y="1476" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Late student after End?</text><text x="900" y="1497" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Start session again. Earlier</text><text x="900" y="1518" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">marks stay (to be verified).</text><circle cx="1084.0" cy="1446.0" r="14" fill="#e0a800"/><text x="1084.0" y="1452.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M540,1490 L710,1490" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="1250" y="1360" width="36" height="24" rx="5" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="1298" y="1378" font-size="16" fill="#1f2a44">Admin action</text><rect x="1250" y="1398" width="36" height="24" rx="5" fill="#dff5e3" stroke="#2e9d4f" stroke-width="2"/><text x="1298" y="1416" font-size="16" fill="#1f2a44">Student action</text><rect x="1250" y="1436" width="36" height="24" rx="5" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="1298" y="1454" font-size="16" fill="#1f2a44">Decision</text><rect x="1250" y="1474" width="36" height="24" rx="5" fill="#ffe3e3" stroke="#c0392b" stroke-width="2"/><text x="1298" y="1492" font-size="16" fill="#1f2a44">Blocked / warning</text><rect x="1250" y="1512" width="36" height="24" rx="5" fill="#f3f3f3" stroke="#888" stroke-width="2"/><text x="1298" y="1530" font-size="16" fill="#1f2a44">Note</text><circle cx="1268" cy="1562" r="13" fill="#e0a800"/><text x="1268" y="1568" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">★</text><text x="1298" y="1568" font-size="16" fill="#1f2a44">Fix for a gap</text></svg>