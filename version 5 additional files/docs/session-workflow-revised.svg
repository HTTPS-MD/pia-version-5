<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1600" height="1400" fill="#fff"/><rect x="170.0" y="28.0" width="320" height="44" rx="10" fill="#1b2a5c" stroke="#1b2a5c" stroke-width="2"/><text x="330" y="56" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">ADMIN</text><rect x="890.0" y="28.0" width="320" height="44" rx="10" fill="#1b2a5c" stroke="#1b2a5c" stroke-width="2"/><text x="1050" y="56" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">STUDENT</text><rect x="170.0" y="105.0" width="320" height="70" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="136" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">1. Start session</text><text x="330" y="157" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">(door opens, everyone = Waiting)</text><path d="M490,140 L1050,140 L1050,190" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="770" y="130" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">door is open</text><rect x="160.0" y="285.0" width="340" height="90" rx="10" fill="#e3efff" stroke="#e0a800" stroke-width="4"/><text x="330" y="316" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">2. Call the roll: mark Present</text><text x="330" y="337" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">or Absent for each student</text><text x="330" y="358" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">(or Mark all present, then fix)</text><circle cx="494.0" cy="291.0" r="14" fill="#e0a800"/><text x="494.0" y="297.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M330,175 L330,285" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="160.0" y="455.0" width="340" height="90" rx="10" fill="#e3efff" stroke="#e0a800" stroke-width="4"/><text x="330" y="486" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Watch the roster:</text><text x="330" y="507" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Present + In / Present, not in yet</text><text x="330" y="528" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Absent / Waiting</text><circle cx="494.0" cy="461.0" r="14" fill="#e0a800"/><text x="494.0" y="467.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M330,375 L330,455" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="890.0" y="190.0" width="320" height="60" rx="10" fill="#dff5e3" stroke="#2e9d4f" stroke-width="2"/><text x="1050" y="216" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">3. Types 11-digit number</text><text x="1050" y="237" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">and confirms name</text><path d="M1050,250 L1050,290" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><polygon points="1050,290.0 1190.0,345 1050,400.0 910.0,345" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="1050" y="351" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Is the door open?</text><rect x="1310.0" y="310.0" width="240" height="70" rx="10" fill="#ffe3e3" stroke="#c0392b" stroke-width="2"/><text x="1430" y="341" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Not open yet.</text><text x="1430" y="362" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Wait for the admin.</text><path d="M1190,345 L1310,345" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1250" y="335" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><path d="M1050,400 L1050,445" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1072" y="428" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><polygon points="1050,445.0 1200.0,500 1050,555.0 900.0,500" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="1050" y="496" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Did the admin mark</text><text x="1050" y="517" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">this student Present?</text><rect x="1300.0" y="460.0" width="260" height="80" rx="10" fill="#ffe3e3" stroke="#c0392b" stroke-width="2"/><text x="1430" y="496" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Cannot enter yet.</text><text x="1430" y="517" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Tell the admin, then retry.</text><path d="M1200,500 L1300,500" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1250" y="490" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><rect x="890.0" y="615.0" width="320" height="70" rx="10" fill="#dff5e3" stroke="#2e9d4f" stroke-width="2"/><text x="1050" y="646" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">4. Enters the game</text><text x="1050" y="667" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">roster shows the student as In</text><path d="M1050,555 L1050,615" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1072" y="590" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><path d="M500,330 L700,330 L700,500 L900,500" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="700" y="318" font-size="15" fill="#555" text-anchor="middle">admin marks</text><rect x="160.0" y="610.0" width="340" height="80" rx="10" fill="#f3f3f3" stroke="#888" stroke-width="2" stroke-dasharray="6 5"/><text x="330" y="646" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Late student? Mark them Present</text><text x="330" y="667" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">while the session is still live.</text><path d="M1050,685 L1050,770 L330,770 L330,800" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="700" y="760" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">when class is done</text><rect x="170.0" y="800.0" width="320" height="60" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="836" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">5. End session</text><polygon points="330,905.0 480.0,960 330,1015.0 180.0,960" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="330" y="956" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Students still</text><text x="330" y="977" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">playing?</text><path d="M330,860 L330,905" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="600.0" y="920.0" width="320" height="80" rx="10" fill="#ffe3e3" stroke="#e0a800" stroke-width="4"/><text x="760" y="956" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Warning: 5 students are still</text><text x="760" y="977" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">playing. They stay in. End anyway?</text><circle cx="914.0" cy="926.0" r="14" fill="#e0a800"/><text x="914.0" y="932.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M480,960 L600,960" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="540" y="950" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><path d="M760,1000 L760,1100 L490,1100" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="170.0" y="1070.0" width="320" height="60" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="1106" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Door closes</text><path d="M330,1015 L330,1070" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="352" y="1045" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><rect x="130.0" y="1170.0" width="400" height="120" rx="10" fill="#e3efff" stroke="#e0a800" stroke-width="4"/><text x="330" y="1206" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Final record keeps 3 results:</text><text x="330" y="1227" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Present and entered</text><text x="330" y="1248" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Present, never entered</text><text x="330" y="1269" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Absent / not marked</text><circle cx="524.0" cy="1176.0" r="14" fill="#e0a800"/><text x="524.0" y="1182.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">★</text><path d="M330,1130 L330,1170" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="250.0" y="1328.0" width="160" height="44" rx="22.0" fill="#e8e8ee" stroke="#666" stroke-width="2"/><text x="330" y="1356" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="700">End</text><path d="M330,1290 L330,1328" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="1070.0" y="1000.0" width="380" height="80" rx="10" fill="#f3f3f3" stroke="#888" stroke-width="2" stroke-dasharray="6 5"/><text x="1260" y="1036" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Note: the session also closes by itself</text><text x="1260" y="1057" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">after 120 minutes</text><rect x="1180" y="1140" width="36" height="24" rx="5" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="1228" y="1158" font-size="16" fill="#1f2a44">Admin action</text><rect x="1180" y="1178" width="36" height="24" rx="5" fill="#dff5e3" stroke="#2e9d4f" stroke-width="2"/><text x="1228" y="1196" font-size="16" fill="#1f2a44">Student action</text><rect x="1180" y="1216" width="36" height="24" rx="5" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="1228" y="1234" font-size="16" fill="#1f2a44">Decision</text><rect x="1180" y="1254" width="36" height="24" rx="5" fill="#ffe3e3" stroke="#c0392b" stroke-width="2"/><text x="1228" y="1272" font-size="16" fill="#1f2a44">Blocked / warning</text><circle cx="1198" cy="1304" r="13" fill="#e0a800"/><text x="1198" y="1310" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">★</text><text x="1228" y="1310" font-size="16" fill="#1f2a44">Fix for a gap in the old flow</text></svg>