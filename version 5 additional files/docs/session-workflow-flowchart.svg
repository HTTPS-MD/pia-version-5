<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" width="1600" height="1360" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1600" height="1360" fill="#fff"/><rect x="170.0" y="28.0" width="320" height="44" rx="10" fill="#1b2a5c" stroke="#1b2a5c" stroke-width="2"/><text x="330" y="56" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">ADMIN</text><rect x="890.0" y="28.0" width="320" height="44" rx="10" fill="#1b2a5c" stroke="#1b2a5c" stroke-width="2"/><text x="1050" y="56" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">STUDENT</text><rect x="170.0" y="105.0" width="320" height="70" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="136" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">1. Start session</text><text x="330" y="157" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">(door opens, everyone = Waiting)</text><path d="M490,140 L1050,140 L1050,190" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="770" y="130" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">door is open</text><rect x="890.0" y="190.0" width="320" height="60" rx="10" fill="#dff5e3" stroke="#2e9d4f" stroke-width="2"/><text x="1050" y="216" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">2. Types 11-digit number</text><text x="1050" y="237" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">and confirms name</text><polygon points="1050,290.0 1190.0,345 1050,400.0 910.0,345" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="1050" y="351" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Is the door open?</text><path d="M1050,250 L1050,290" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="1310.0" y="310.0" width="240" height="70" rx="10" fill="#ffe3e3" stroke="#c0392b" stroke-width="2"/><text x="1430" y="341" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Not open yet.</text><text x="1430" y="362" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Wait for the admin.</text><path d="M1190,345 L1310,345" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1250" y="335" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><polygon points="1050,445.0 1200.0,500 1050,555.0 900.0,500" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="1050" y="496" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Did the admin mark</text><text x="1050" y="517" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">this student Absent?</text><path d="M1050,400 L1050,445" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1072" y="428" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><rect x="1310.0" y="465.0" width="240" height="70" rx="10" fill="#ffe3e3" stroke="#c0392b" stroke-width="2"/><text x="1430" y="496" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Cannot enter.</text><text x="1430" y="517" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Tell the admin.</text><path d="M1200,500 L1310,500" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1255" y="490" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><rect x="890.0" y="615.0" width="320" height="70" rx="10" fill="#dff5e3" stroke="#2e9d4f" stroke-width="2"/><text x="1050" y="646" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">3. Enters the game</text><text x="1050" y="667" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Marked Present automatically</text><path d="M1050,555 L1050,615" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="1072" y="590" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><rect x="170.0" y="295.0" width="320" height="70" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="326" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Watch the roster:</text><text x="330" y="347" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Waiting / Present / Absent</text><path d="M330,175 L330,295" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="170.0" y="465.0" width="320" height="70" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="496" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Optional: mark a student</text><text x="330" y="517" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Absent to block them</text><path d="M330,365 L330,465" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><path d="M490,500 L900,500" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><path d="M1050,685 L1050,760 L330,760 L330,790" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="700" y="750" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">when class is done</text><rect x="170.0" y="790.0" width="320" height="60" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="826" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">4. End session</text><polygon points="330,895.0 480.0,950 330,1005.0 180.0,950" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="330" y="946" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Students still</text><text x="330" y="967" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">playing?</text><path d="M330,850 L330,895" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="610.0" y="910.0" width="300" height="80" rx="10" fill="#ffe3e3" stroke="#c0392b" stroke-width="2"/><text x="760" y="946" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Warning: they stay in.</text><text x="760" y="967" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Confirm End anyway?</text><path d="M480,950 L610,950" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="545" y="940" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">Yes</text><path d="M760,990 L760,1080 L490,1080" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="170.0" y="1050.0" width="320" height="60" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="1086" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Door closes</text><path d="M330,1005 L330,1050" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="352" y="1032" font-size="16" font-weight="700" fill="#b06a00" text-anchor="middle">No</text><rect x="170.0" y="1145.0" width="320" height="70" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="1176" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Students who never entered</text><text x="330" y="1197" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">become Absent</text><path d="M330,1110 L330,1145" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="150.0" y="1250.0" width="360" height="70" rx="10" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="330" y="1281" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Attendance record is kept:</text><text x="330" y="1302" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Present or Absent</text><path d="M330,1215 L330,1250" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/><rect x="1070.0" y="980.0" width="380" height="80" rx="10" fill="#f3f3f3" stroke="#888" stroke-width="2" stroke-dasharray="6 5"/><text x="1260" y="1016" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">Note: the session also closes by itself</text><text x="1260" y="1037" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="400">after 120 minutes</text><rect x="1180" y="1130" width="36" height="24" rx="5" fill="#e3efff" stroke="#3b6fd4" stroke-width="2"/><text x="1228" y="1148" font-size="16" fill="#1f2a44">Admin action</text><rect x="1180" y="1168" width="36" height="24" rx="5" fill="#dff5e3" stroke="#2e9d4f" stroke-width="2"/><text x="1228" y="1186" font-size="16" fill="#1f2a44">Student action</text><rect x="1180" y="1206" width="36" height="24" rx="5" fill="#fff3d6" stroke="#d4962a" stroke-width="2"/><text x="1228" y="1224" font-size="16" fill="#1f2a44">Decision</text><rect x="1180" y="1244" width="36" height="24" rx="5" fill="#ffe3e3" stroke="#c0392b" stroke-width="2"/><text x="1228" y="1262" font-size="16" fill="#1f2a44">Blocked / warning</text><text x="1180" y="1306" font-size="15" fill="#555">Dashed line = admin watching in parallel</text></svg>