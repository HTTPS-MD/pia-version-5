<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2060" width="1500" height="2060" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1500" height="2060" fill="#fff"/><text x="750" y="30" text-anchor="middle" font-size="22" font-weight="700">PIA System: Session Flowchart (Attendance and Entry)</text><rect x="510.0" y="35.0" width="180" height="50" rx="25.0" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="65" text-anchor="middle" font-size="16" fill="#000">START</text><path d="M600,85 L600,140" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="380.0" y="140.0" width="440" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="165" text-anchor="middle" font-size="16" fill="#000">Admin opens the session:</text><text x="600" y="185" text-anchor="middle" font-size="16" fill="#000">door opens, 120-minute timer, stages locked</text><path d="M600,200 L600,260" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="370.0" y="260.0" width="460" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="285" text-anchor="middle" font-size="16" fill="#000">Admin takes attendance: Mark all present,</text><text x="600" y="305" text-anchor="middle" font-size="16" fill="#000">then sets Absent for students not in the room</text><path d="M600,320 L600,370" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><polygon points="424.0,370.0 800.0,370.0 776.0,430.0 400.0,430.0" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="395" text-anchor="middle" font-size="16" fill="#000">Student types the 11-digit number</text><text x="600" y="415" text-anchor="middle" font-size="16" fill="#000">and confirms the name</text><path d="M600,430 L600,480" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><polygon points="600,480.0 730.0,530 600,580.0 470.0,530" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="525" text-anchor="middle" font-size="16" fill="#000">Is the door</text><text x="600" y="545" text-anchor="middle" font-size="16" fill="#000">open?</text><rect x="850.0" y="500.0" width="300" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="1000" y="525" text-anchor="middle" font-size="16" fill="#000">Show: Not open yet.</text><text x="1000" y="545" text-anchor="middle" font-size="16" fill="#000">Wait for the admin.</text><path d="M730,530 L850,530" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="790" y="520" font-size="15" font-weight="700" fill="#000" text-anchor="middle">No</text><path d="M1000,500 L1000,400 L800,400" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><path d="M600,580 L600,630" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="622" y="610" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Yes</text><polygon points="600,630.0 750.0,680 600,730.0 450.0,680" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="675" text-anchor="middle" font-size="16" fill="#000">Did the admin mark</text><text x="600" y="695" text-anchor="middle" font-size="16" fill="#000">this student Present?</text><rect x="850.0" y="650.0" width="300" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="1000" y="675" text-anchor="middle" font-size="16" fill="#000">Show: Cannot enter yet.</text><text x="1000" y="695" text-anchor="middle" font-size="16" fill="#000">Tell the admin, then retry.</text><path d="M750,680 L850,680" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="800" y="670" font-size="15" font-weight="700" fill="#000" text-anchor="middle">No</text><path d="M1150,680 L1200,680 L1200,400 L800,400" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><path d="M600,730 L600,790" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="622" y="765" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Yes</text><polygon points="600,790.0 750.0,840 600,890.0 450.0,840" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="835" text-anchor="middle" font-size="16" fill="#000">Is the number</text><text x="600" y="855" text-anchor="middle" font-size="16" fill="#000">already signed in?</text><rect x="840.0" y="800.0" width="320" height="80" fill="#fff" stroke="#000" stroke-width="2"/><text x="1000" y="825" text-anchor="middle" font-size="16" fill="#000">Older sign-in is signed out.</text><text x="1000" y="845" text-anchor="middle" font-size="16" fill="#000">Re-entry is counted on the</text><text x="1000" y="865" text-anchor="middle" font-size="16" fill="#000">admin's row for that student</text><path d="M750,840 L840,840" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="795" y="830" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Yes</text><path d="M1000,880 L1000,990 L790,990" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><path d="M600,890 L600,960" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="622" y="930" font-size="15" font-weight="700" fill="#000" text-anchor="middle">No</text><rect x="380.0" y="960.0" width="440" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="985" text-anchor="middle" font-size="16" fill="#000">Student enters and waits in the waiting room.</text><text x="600" y="1005" text-anchor="middle" font-size="16" fill="#000">Roster shows the student as In</text><path d="M600,1020 L600,1090" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><polygon points="600,1090.0 725.0,1140 600,1190.0 475.0,1140" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1135" text-anchor="middle" font-size="16" fill="#000">Is the attendance</text><text x="600" y="1155" text-anchor="middle" font-size="16" fill="#000">done?</text><polygon points="1000,1090.0 1140.0,1140 1000,1190.0 860.0,1140" fill="#fff" stroke="#000" stroke-width="2"/><text x="1000" y="1135" text-anchor="middle" font-size="16" fill="#000">Has the 120-minute</text><text x="1000" y="1155" text-anchor="middle" font-size="16" fill="#000">timer run out?</text><path d="M725,1140 L860,1140" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="792" y="1130" font-size="15" font-weight="700" fill="#000" text-anchor="middle">No</text><path d="M1140,1140 L1250,1140 L1250,1065 L600,1065" fill="none" stroke="#000" stroke-width="2"/><text x="1190" y="1130" font-size="15" font-weight="700" fill="#000" text-anchor="middle">No</text><rect x="850.0" y="1260.0" width="300" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="1000" y="1285" text-anchor="middle" font-size="16" fill="#000">Door closes by itself</text><text x="1000" y="1305" text-anchor="middle" font-size="16" fill="#000">(no one pressed Close)</text><path d="M1000,1190 L1000,1260" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="1022" y="1225" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Yes</text><path d="M1150,1290 L1350,1290 L1350,1450 L790,1450" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="410.0" y="1260.0" width="380" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1295" text-anchor="middle" font-size="16" fill="#000">Admin closes the session</text><path d="M600,1190 L600,1260" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="622" y="1230" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Yes</text><path d="M600,1320 L600,1420" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="400.0" y="1420.0" width="400" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1455" text-anchor="middle" font-size="16" fill="#000">Door closes. Stage toggles unlock.</text><path d="M600,1480 L600,1530" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="360.0" y="1530.0" width="480" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1555" text-anchor="middle" font-size="16" fill="#000">Students marked Present who never entered</text><text x="600" y="1575" text-anchor="middle" font-size="16" fill="#000">become: Present, did not participate</text><path d="M600,1590 L600,1640" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><polygon points="364.0,1645.0 860.0,1645.0 836.0,1715.0 340.0,1715.0" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1675" text-anchor="middle" font-size="16" fill="#000">Display the final record: Present participated,</text><text x="600" y="1695" text-anchor="middle" font-size="16" fill="#000">Present did not participate, Absent, Not marked</text><path d="M600,1715 L600,1770" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="390.0" y="1770.0" width="420" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1795" text-anchor="middle" font-size="16" fill="#000">Admin opens the stages manually:</text><text x="600" y="1815" text-anchor="middle" font-size="16" fill="#000">OCEAN test, Choose tutor, Game</text><path d="M600,1830 L600,1890" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="510.0" y="1895.0" width="180" height="50" rx="25.0" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1925" text-anchor="middle" font-size="16" fill="#000">END</text><text x="40" y="80" font-size="16" font-weight="700">Symbols</text><rect x="40" y="100" width="90" height="34" rx="17" fill="#fff" stroke="#000" stroke-width="2"/><text x="150" y="123" font-size="15">Start / End</text><rect x="40" y="160" width="90" height="34" fill="#fff" stroke="#000" stroke-width="2"/><text x="150" y="183" font-size="15">Process</text><polygon points="85,215 130,240 85,265 40,240" fill="#fff" stroke="#000" stroke-width="2"/><text x="150" y="245" font-size="15">Decision</text><polygon points="52,285 130,285 118,319 40,319" fill="#fff" stroke="#000" stroke-width="2"/><text x="150" y="308" font-size="15">Input / Output</text></svg>