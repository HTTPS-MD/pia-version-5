<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 780 2760 1200" width="2760" height="1200" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="2760" height="2760" fill="#fff"/><g transform="translate(0,780)"><line x1="1960" y1="40" x2="1960" y2="1100" stroke="#999" stroke-width="2" stroke-dasharray="10 8"/><text x="30" y="50" font-size="22" font-weight="700" fill="#111">STUDENT</text><text x="2000" y="50" font-size="22" font-weight="700" fill="#111">ADMIN</text><polygon points="70,130 230,130 230,184 150,214 70,184" fill="#fff" stroke="#222" stroke-width="2"/><text x="150" y="159.45" text-anchor="middle" font-size="17" fill="#111">From Start</text><text x="150" y="180.45" text-anchor="middle" font-size="17" fill="#111">(page X1)</text><polygon points="375,126 615,126 585,214 345,214" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="165.45" text-anchor="middle" font-size="17" fill="#111">Enter student</text><text x="480" y="186.45" text-anchor="middle" font-size="17" fill="#111">number, press Join</text><path d="M730,138 v70 a80,18 0 0 0 160,0 v-70" fill="#fff" stroke="#222" stroke-width="2"/><ellipse cx="810" cy="138" rx="80" ry="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="186.6" text-anchor="middle" font-size="16" fill="#111">Supabase</text><text x="810" y="206.6" text-anchor="middle" font-size="16" fill="#111">(door)</text><polygon points="1140,100 1275,170 1140,240 1005,170" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="165.6" text-anchor="middle" font-size="16" fill="#111">Registered and</text><text x="1140" y="185.6" text-anchor="middle" font-size="16" fill="#111">not removed?</text><rect x="1345" y="126" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="1470" y="165.45" text-anchor="middle" font-size="17" fill="#111">Can't let you in yet.</text><text x="1470" y="186.45" text-anchor="middle" font-size="17" fill="#111">Tell your admin.</text><rect x="1370" y="306" width="200" height="68" rx="34" fill="#fff" stroke="#222" stroke-width="2"/><text x="1470" y="345.95" text-anchor="middle" font-size="17" fill="#111">END</text><polygon points="1140,270 1275,340 1140,410 1005,340" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="335.6" text-anchor="middle" font-size="16" fill="#111">Entered</text><text x="1140" y="355.6" text-anchor="middle" font-size="16" fill="#111">before?</text><polygon points="810,270 945,340 810,410 675,340" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="335.6" text-anchor="middle" font-size="16" fill="#111">Door still</text><text x="810" y="355.6" text-anchor="middle" font-size="16" fill="#111">open?</text><rect x="355" y="296" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="324.95" text-anchor="middle" font-size="17" fill="#111">Can't let you in yet</text><text x="480" y="345.95" text-anchor="middle" font-size="17" fill="#111">(the door is closed).</text><text x="480" y="366.95" text-anchor="middle" font-size="17" fill="#111">Tell your admin.</text><rect x="380" y="476" width="200" height="68" rx="34" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="515.95" text-anchor="middle" font-size="17" fill="#111">END</text><rect x="685" y="466" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="505.45" text-anchor="middle" font-size="17" fill="#111">First entry: sign in</text><text x="810" y="526.45" text-anchor="middle" font-size="17" fill="#111">(one session at a time)</text><polygon points="730,640 890,640 890,694 810,724 730,694" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="658.95" text-anchor="middle" font-size="17" fill="#111">OCEAN and</text><text x="810" y="679.95" text-anchor="middle" font-size="17" fill="#111">groups</text><text x="810" y="700.95" text-anchor="middle" font-size="17" fill="#111">(page S2)</text><rect x="1015" y="466" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="494.95" text-anchor="middle" font-size="17" fill="#111">Can't let you in yet.</text><text x="1140" y="515.95" text-anchor="middle" font-size="17" fill="#111">Waiting for your admin...</text><text x="1140" y="536.95" text-anchor="middle" font-size="17" fill="#111">(asks again quietly)</text><circle cx="1140" cy="680" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="686.3" text-anchor="middle" font-size="18" fill="#111">B</text><rect x="355" y="636" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="664.95" text-anchor="middle" font-size="17" fill="#111">After Let back in: the next</text><text x="480" y="685.95" text-anchor="middle" font-size="17" fill="#111">ask passes and you</text><text x="480" y="706.95" text-anchor="middle" font-size="17" fill="#111">sign in again</text><circle cx="150" cy="680" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="150" y="686.3" text-anchor="middle" font-size="18" fill="#111">C</text><polygon points="400,810 560,810 560,864 480,894 400,864" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="828.95" text-anchor="middle" font-size="17" fill="#111">OCEAN and</text><text x="480" y="849.95" text-anchor="middle" font-size="17" fill="#111">groups</text><text x="480" y="870.95" text-anchor="middle" font-size="17" fill="#111">(page S2)</text><path d="M230,170 L345,170" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M615,170 L730,170" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M890,170 L1005,170" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M1275,170 L1345,170" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="1318" y="160" font-size="15" font-weight="700" fill="#555" text-anchor="middle">No</text><path d="M1470,214 L1470,306" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M1140,240 L1140,270" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="1162" y="265" font-size="15" font-weight="700" fill="#555" text-anchor="middle">Yes</text><path d="M1005,340 L945,340" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="962" y="330" font-size="15" font-weight="700" fill="#555" text-anchor="middle">No</text><path d="M675,340 L605,340" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="632" y="330" font-size="15" font-weight="700" fill="#555" text-anchor="middle">No</text><path d="M480,384 L480,476" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M810,410 L810,466" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="832" y="435" font-size="15" font-weight="700" fill="#555" text-anchor="middle">Yes</text><path d="M810,554 L810,640" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M1140,410 L1140,466" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="1162" y="435" font-size="15" font-weight="700" fill="#555" text-anchor="middle">Yes</text><path d="M1140,554 L1140,656" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M174,680 L355,680" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M480,724 L480,810" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><circle cx="2130" cy="680" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="2130" y="686.3" text-anchor="middle" font-size="18" fill="#111">B</text><rect x="2335" y="636" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="2460" y="664.95" text-anchor="middle" font-size="17" fill="#111">The bell shows the student:</text><text x="2460" y="685.95" text-anchor="middle" font-size="17" fill="#111">ask the class, is it</text><text x="2460" y="706.95" text-anchor="middle" font-size="17" fill="#111">the real student?</text><polygon points="2460,780 2595,850 2460,920 2325,850" fill="#fff" stroke="#222" stroke-width="2"/><text x="2460" y="855.6" text-anchor="middle" font-size="16" fill="#111">Let back in?</text><circle cx="2130" cy="850" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="2130" y="856.3" text-anchor="middle" font-size="18" fill="#111">C</text><rect x="2335" y="976" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="2460" y="1015.45" text-anchor="middle" font-size="17" fill="#111">Dismissed: the student</text><text x="2460" y="1036.45" text-anchor="middle" font-size="17" fill="#111">keeps waiting</text><path d="M2154,680 L2335,680" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M2460,724 L2460,780" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M2325,850 L2154,850" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="2282" y="840" font-size="15" font-weight="700" fill="#555" text-anchor="middle">Yes</text><path d="M2460,920 L2460,976" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="2482" y="945" font-size="15" font-weight="700" fill="#555" text-anchor="middle">No</text><text x="40" y="1170" font-size="22" font-weight="700" fill="#111">Page Y1: How a student joins and comes back (Let back in)</text></g></svg>