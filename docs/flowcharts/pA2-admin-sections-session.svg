<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 1750" width="1750" height="1750" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="1750" height="1750" fill="#fff"/><g transform="translate(0,55)"><polygon points="70,110 230,110 230,164 150,194 70,164" fill="#fff" stroke="#222" stroke-width="2"/><text x="150" y="139.45" text-anchor="middle" font-size="17" fill="#111">From dashboard</text><text x="150" y="160.45" text-anchor="middle" font-size="17" fill="#111">(page A1)</text><rect x="355" y="106" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="145.45" text-anchor="middle" font-size="17" fill="#111">Display the Sections</text><text x="480" y="166.45" text-anchor="middle" font-size="17" fill="#111">page: choose a section</text><polygon points="810,80 945,150 810,220 675,150" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="145.6" text-anchor="middle" font-size="16" fill="#111">Section has</text><text x="810" y="165.6" text-anchor="middle" font-size="16" fill="#111">students?</text><rect x="1015" y="106" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="145.45" text-anchor="middle" font-size="17" fill="#111">Assign a teacher</text><text x="1140" y="166.45" text-anchor="middle" font-size="17" fill="#111">(Add teacher if new)</text><rect x="1345" y="106" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="1470" y="134.95" text-anchor="middle" font-size="17" fill="#111">Face to face roll; remove</text><text x="1470" y="155.95" text-anchor="middle" font-size="17" fill="#111">absent students, then</text><text x="1470" y="176.95" text-anchor="middle" font-size="17" fill="#111">press Start</text><rect x="685" y="276" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="315.45" text-anchor="middle" font-size="17" fill="#111">Add students</text><text x="810" y="336.45" text-anchor="middle" font-size="17" fill="#111">(Add Students window)</text><circle cx="810" cy="490" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="496.3" text-anchor="middle" font-size="18" fill="#111">1</text><circle cx="1140" cy="320" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="326.3" text-anchor="middle" font-size="18" fill="#111">1</text><rect x="1345" y="276" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="1470" y="294.45" text-anchor="middle" font-size="17" fill="#111">Watch Entered x of n. A</text><text x="1470" y="315.45" text-anchor="middle" font-size="17" fill="#111">returning student shows in</text><text x="1470" y="336.45" text-anchor="middle" font-size="17" fill="#111">the bell: ask the class, then</text><text x="1470" y="357.45" text-anchor="middle" font-size="17" fill="#111">Let back in or Dismiss</text><rect x="1345" y="446" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="1470" y="485.45" text-anchor="middle" font-size="17" fill="#111">Press End: a table lists</text><text x="1470" y="506.45" text-anchor="middle" font-size="17" fill="#111">who has not entered</text><polygon points="1470,590 1605,660 1470,730 1335,660" fill="#fff" stroke="#222" stroke-width="2"/><text x="1470" y="655.6" text-anchor="middle" font-size="16" fill="#111">Are you sure</text><text x="1470" y="675.6" text-anchor="middle" font-size="16" fill="#111">you want to close?</text><rect x="1345" y="786" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="1470" y="814.95" text-anchor="middle" font-size="17" fill="#111">Closed: the door shuts</text><text x="1470" y="835.95" text-anchor="middle" font-size="17" fill="#111">for anyone who never</text><text x="1470" y="856.95" text-anchor="middle" font-size="17" fill="#111">entered</text><polygon points="1140,760 1275,830 1140,900 1005,830" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="815.6" text-anchor="middle" font-size="16" fill="#111">Someone can</text><text x="1140" y="835.6" text-anchor="middle" font-size="16" fill="#111">enter the</text><text x="1140" y="855.6" text-anchor="middle" font-size="16" fill="#111">next stage?</text><circle cx="1140" cy="660" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="666.3" text-anchor="middle" font-size="18" fill="#111">2</text><rect x="685" y="786" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="814.95" text-anchor="middle" font-size="17" fill="#111">Display: cannot open</text><text x="810" y="835.95" text-anchor="middle" font-size="17" fill="#111">(who and why, in a table).</text><text x="810" y="856.95" text-anchor="middle" font-size="17" fill="#111">Fix it, then try again</text><circle cx="480" cy="830" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="836.3" text-anchor="middle" font-size="18" fill="#111">2</text><rect x="1015" y="956" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="984.95" text-anchor="middle" font-size="17" fill="#111">Open the stage (OCEAN,</text><text x="1140" y="1005.95" text-anchor="middle" font-size="17" fill="#111">Choose a tutor, Game);</text><text x="1140" y="1026.95" text-anchor="middle" font-size="17" fill="#111">an empty earlier one closes</text><polygon points="1140,1100 1275,1170 1140,1240 1005,1170" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="1165.6" text-anchor="middle" font-size="16" fill="#111">Another stage</text><text x="1140" y="1185.6" text-anchor="middle" font-size="16" fill="#111">to open?</text><circle cx="1470" cy="1170" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="1470" y="1176.3" text-anchor="middle" font-size="18" fill="#111">2</text><polygon points="1140,1270 1275,1340 1140,1410 1005,1340" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="1335.6" text-anchor="middle" font-size="16" fill="#111">Experiment</text><text x="1140" y="1355.6" text-anchor="middle" font-size="16" fill="#111">finished?</text><rect x="685" y="1296" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="1335.45" text-anchor="middle" font-size="17" fill="#111">Close Game: sign out</text><text x="810" y="1356.45" text-anchor="middle" font-size="17" fill="#111">everyone online</text><rect x="380" y="1306" width="200" height="68" rx="34" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="1345.95" text-anchor="middle" font-size="17" fill="#111">END</text><rect x="1015" y="1466" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="1140" y="1505.45" text-anchor="middle" font-size="17" fill="#111">Game runs;</text><text x="1140" y="1526.45" text-anchor="middle" font-size="17" fill="#111">watch the table</text><circle cx="1470" cy="1510" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="1470" y="1516.3" text-anchor="middle" font-size="18" fill="#111">3</text><circle cx="1470" cy="1340" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="1470" y="1346.3" text-anchor="middle" font-size="18" fill="#111">3</text><path d="M230,150 L355,150" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M605,150 L675,150" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M945,150 L1015,150" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="988" y="140" font-size="15" font-weight="700" fill="#555" text-anchor="middle">Yes</text><path d="M1265,150 L1345,150" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M810,220 L810,276" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="832" y="245" font-size="15" font-weight="700" fill="#555" text-anchor="middle">No</text><path d="M810,364 L810,466" fill="none" stroke="#222" stroke-w