<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 0 1500 1860" width="1500" height="1860" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="1860" height="1860" fill="#fff"/><g transform="translate(180,0)"><rect x="50" y="136" width="200" height="68" rx="34" fill="#fff" stroke="#222" stroke-width="2"/><text x="150" y="175.95" text-anchor="middle" font-size="17" fill="#111">START</text><rect x="355" y="126" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="154.95" text-anchor="middle" font-size="17" fill="#111">Check who is here</text><text x="480" y="175.95" text-anchor="middle" font-size="17" fill="#111">face to face</text><text x="480" y="196.95" text-anchor="middle" font-size="17" fill="#111">(outside the system)</text><rect x="355" y="296" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="314.45" text-anchor="middle" font-size="17" fill="#111">Remove the absent students</text><text x="480" y="335.45" text-anchor="middle" font-size="17" fill="#111">from this session</text><text x="480" y="356.45" text-anchor="middle" font-size="17" fill="#111">(hidden, not deleted;</text><text x="480" y="377.45" text-anchor="middle" font-size="17" fill="#111">can be added back)</text><rect x="355" y="466" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="494.95" text-anchor="middle" font-size="17" fill="#111">Press Start (the door opens</text><text x="480" y="515.95" text-anchor="middle" font-size="17" fill="#111">for the students who</text><text x="480" y="536.95" text-anchor="middle" font-size="17" fill="#111">are left in the section)</text><polygon points="730,470 890,470 890,524 810,554 730,524" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="499.45" text-anchor="middle" font-size="17" fill="#111">Students join</text><text x="810" y="520.45" text-anchor="middle" font-size="17" fill="#111">(page Y1)</text><rect x="355" y="636" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="675.45" text-anchor="middle" font-size="17" fill="#111">Watch the live count:</text><text x="480" y="696.45" text-anchor="middle" font-size="17" fill="#111">Entered 12 of 15</text><circle cx="150" cy="680" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="150" y="686.3" text-anchor="middle" font-size="18" fill="#111">1</text><rect x="355" y="806" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="824.45" text-anchor="middle" font-size="17" fill="#111">A student who entered and lost</text><text x="480" y="845.45" text-anchor="middle" font-size="17" fill="#111">the login shows in the bell:</text><text x="480" y="866.45" text-anchor="middle" font-size="17" fill="#111">ask the class, then Let back</text><text x="480" y="887.45" text-anchor="middle" font-size="17" fill="#111">in or Dismiss</text><polygon points="480,950 615,1020 480,1090 345,1020" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="1015.6" text-anchor="middle" font-size="16" fill="#111">Everyone who is</text><text x="480" y="1035.6" text-anchor="middle" font-size="16" fill="#111">here is in?</text><circle cx="150" cy="1020" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="150" y="1026.3" text-anchor="middle" font-size="18" fill="#111">1</text><rect x="355" y="1146" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="1185.45" text-anchor="middle" font-size="17" fill="#111">Press End: a table lists</text><text x="480" y="1206.45" text-anchor="middle" font-size="17" fill="#111">who has not entered</text><polygon points="480,1290 615,1360 480,1430 345,1360" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="1355.6" text-anchor="middle" font-size="16" fill="#111">Are you sure</text><text x="480" y="1375.6" text-anchor="middle" font-size="16" fill="#111">you want to close?</text><circle cx="150" cy="1360" r="24" fill="#fff" stroke="#222" stroke-width="2"/><text x="150" y="1366.3" text-anchor="middle" font-size="18" fill="#111">1</text><polygon points="480,1460 615,1530 480,1600 345,1530" fill="#fff" stroke="#222" stroke-width="2"/><text x="480" y="1525.6" text-anchor="middle" font-size="16" fill="#111">Also open</text><text x="480" y="1545.6" text-anchor="middle" font-size="16" fill="#111">OCEAN now?</text><rect x="25" y="1486" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="150" y="1504.45" text-anchor="middle" font-size="17" fill="#111">Closed: nobody new can</text><text x="150" y="1525.45" text-anchor="middle" font-size="17" fill="#111">enter. Students who</text><text x="150" y="1546.45" text-anchor="middle" font-size="17" fill="#111">entered may come back.</text><text x="150" y="1567.45" text-anchor="middle" font-size="17" fill="#111">Open OCEAN later</text><rect x="685" y="1486" width="250" height="88" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="1525.45" text-anchor="middle" font-size="17" fill="#111">Closed and OCEAN</text><text x="810" y="1546.45" text-anchor="middle" font-size="17" fill="#111">opens (one step)</text><polygon points="70,1660 230,1660 230,1714 150,1744 70,1714" fill="#fff" stroke="#222" stroke-width="2"/><text x="150" y="1678.95" text-anchor="middle" font-size="17" fill="#111">Stages and</text><text x="150" y="1699.95" text-anchor="middle" font-size="17" fill="#111">Close Game</text><text x="150" y="1720.95" text-anchor="middle" font-size="17" fill="#111">(page X2)</text><polygon points="730,1660 890,1660 890,1714 810,1744 730,1714" fill="#fff" stroke="#222" stroke-width="2"/><text x="810" y="1678.95" text-anchor="middle" font-size="17" fill="#111">Stages and</text><text x="810" y="1699.95" text-anchor="middle" font-size="17" fill="#111">Close Game</text><text x="810" y="1720.95" text-anchor="middle" font-size="17" fill="#111">(page X2)</text><path d="M250,170 L355,170" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M480,214 L480,296" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M480,384 L480,466" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M605,510 L730,510" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M480,554 L480,636" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M174,680 L355,680" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M480,724 L480,806" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M480,894 L480,950" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M345,1020 L174,1020" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="302" y="1010" font-size="15" font-weight="700" fill="#555" text-anchor="middle">No</text><path d="M480,1090 L480,1146" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="502" y="1115" font-size="15" font-weight="700" fill="#555" text-anchor="middle">Yes</text><path d="M480,1234 L480,1290" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M345,1360 L174,1360" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="302" y="1350" font-size="15" font-weight="700" fill="#555" text-anchor="middle">No</text><path d="M480,1430 L480,1460" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="502" y="1455" font-size="15" font-weight="700" fill="#555" text-anchor="middle">Yes</text><path d="M345,1530 L275,1530" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="302" y="1520" font-size="15" font-weight="700" fill="#555" text-anchor="middle">No</text><path d="M615,1530 L685,1530" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="658" y="1520" font-size="15" font-weight="700" fill="#555" text-anchor="middle">Yes</text><path d="M150,1574 L150,1660" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><path d="M810,1574 L810,1660" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="40" y="1830" font-size="22" font-weight="700" fill="#111">Page X1: Admin, from the face-to-face check to End</text></g></svg>