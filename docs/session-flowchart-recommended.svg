<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1930" width="1500" height="1930" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="1500" height="1930" fill="#fff"/><text x="750" y="30" text-anchor="middle" font-size="22" font-weight="700">PIA System: Attendance and Entry Flowchart (Recommended Flow)</text><rect x="510.0" y="35.0" width="180" height="50" rx="25.0" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="65" text-anchor="middle" font-size="16" fill="#000">START</text><path d="M600,85 L600,140" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="400.0" y="140.0" width="400" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="165" text-anchor="middle" font-size="16" fill="#000">Admin: Start attendance</text><text x="600" y="185" text-anchor="middle" font-size="16" fill="#000">(stages are locked)</text><path d="M600,200 L600,260" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="370.0" y="260.0" width="460" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="285" text-anchor="middle" font-size="16" fill="#000">Admin marks students: Mark all present,</text><text x="600" y="305" text-anchor="middle" font-size="16" fill="#000">then sets Absent for those not in the room</text><path d="M600,320 L600,380" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="370.0" y="380.0" width="460" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="405" text-anchor="middle" font-size="16" fill="#000">Admin: End attendance</text><text x="600" y="425" text-anchor="middle" font-size="16" fill="#000">(stages unlock; Present students can still enter)</text><path d="M600,440 L600,500" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><polygon points="424.0,500.0 800.0,500.0 776.0,560.0 400.0,560.0" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="525" text-anchor="middle" font-size="16" fill="#000">Student types the number</text><text x="600" y="545" text-anchor="middle" font-size="16" fill="#000">and confirms the name</text><path d="M600,560 L600,610" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><polygon points="600,610.0 760.0,660 600,710.0 440.0,660" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="655" text-anchor="middle" font-size="16" fill="#000">Was attendance started</text><text x="600" y="675" text-anchor="middle" font-size="16" fill="#000">within the last 16 hours?</text><rect x="850.0" y="630.0" width="300" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="1000" y="655" text-anchor="middle" font-size="16" fill="#000">Cannot enter.</text><text x="1000" y="675" text-anchor="middle" font-size="16" fill="#000">Admin starts attendance again.</text><path d="M760,660 L850,660" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="805" y="650" font-size="15" font-weight="700" fill="#000" text-anchor="middle">No</text><path d="M1150,660 L1220,660 L1220,530 L800,530" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><path d="M600,710 L600,750" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="622" y="735" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Yes</text><polygon points="600,750.0 750.0,800 600,850.0 450.0,800" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="795" text-anchor="middle" font-size="16" fill="#000">Is the student</text><text x="600" y="815" text-anchor="middle" font-size="16" fill="#000">marked Present?</text><rect x="850.0" y="770.0" width="300" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="1000" y="795" text-anchor="middle" font-size="16" fill="#000">Cannot enter.</text><text x="1000" y="815" text-anchor="middle" font-size="16" fill="#000">Student tells the admin.</text><path d="M750,800 L850,800" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="800" y="790" font-size="15" font-weight="700" fill="#000" text-anchor="middle">No</text><path d="M1150,800 L1220,800" fill="none" stroke="#000" stroke-width="2"/><path d="M600,850 L600,890" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="622" y="875" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Yes</text><polygon points="600,890.0 750.0,940 600,990.0 450.0,940" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="935" text-anchor="middle" font-size="16" fill="#000">Has this student</text><text x="600" y="955" text-anchor="middle" font-size="16" fill="#000">already entered once?</text><rect x="830.0" y="905.0" width="340" height="70" fill="#fff" stroke="#000" stroke-width="2"/><text x="1000" y="935" text-anchor="middle" font-size="16" fill="#000">Refused. Counted as Blocked and logged.</text><text x="1000" y="955" text-anchor="middle" font-size="16" fill="#000">Admin may tap Let back in (real cases only).</text><path d="M750,940 L830,940" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="790" y="930" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Yes</text><path d="M1170,940 L1220,940 L1220,660" fill="none" stroke="#000" stroke-width="2"/><path d="M600,990 L600,1050" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="622" y="1025" font-size="15" font-weight="700" fill="#000" text-anchor="middle">No</text><rect x="390.0" y="1050.0" width="420" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1075" text-anchor="middle" font-size="16" fill="#000">Student enters the waiting room.</text><text x="600" y="1095" text-anchor="middle" font-size="16" fill="#000">Admin roster shows: In</text><path d="M600,1110 L600,1170" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="380.0" y="1170.0" width="440" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1195" text-anchor="middle" font-size="16" fill="#000">Admin opens the stages one at a time:</text><text x="600" y="1215" text-anchor="middle" font-size="16" fill="#000">OCEAN test, Choose tutor, Game</text><path d="M600,1230 L600,1290" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="380.0" y="1290.0" width="440" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1315" text-anchor="middle" font-size="16" fill="#000">Students take part. Answers are saved</text><text x="600" y="1335" text-anchor="middle" font-size="16" fill="#000">to the account that signed in</text><path d="M600,1350 L600,1410" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="400.0" y="1410.0" width="400" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1435" text-anchor="middle" font-size="16" fill="#000">Experiment is over:</text><text x="600" y="1455" text-anchor="middle" font-size="16" fill="#000">Admin closes ALL stages</text><path d="M600,1470 L600,1530" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><rect x="450.0" y="1530.0" width="300" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1565" text-anchor="middle" font-size="16" fill="#000">Students log out</text><path d="M600,1590 L600,1630" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><polygon points="600,1630.0 740.0,1680 600,1730.0 460.0,1680" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1675" text-anchor="middle" font-size="16" fill="#000">Is anyone still</text><text x="600" y="1695" text-anchor="middle" font-size="16" fill="#000">logged in?</text><rect x="850.0" y="1650.0" width="300" height="60" fill="#fff" stroke="#000" stroke-width="2"/><text x="1000" y="1685" text-anchor="middle" font-size="16" fill="#000">Admin signs them out</text><path d="M740,1680 L850,1680" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="795" y="1670" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Yes</text><path d="M1000,1710 L1000,1830 L690,1830" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><path d="M600,1730 L600,1805" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/><text x="622" y="1775" font-size="15" font-weight="700" fill="#000" text-anchor="middle">No</text><rect x="510.0" y="1805.0" width="180" height="50" rx="25.0" fill="#fff" stroke="#000" stroke-width="2"/><text x="600" y="1835" text-anchor="middle" font-size="16" fill="#000">END</text><text x="40" y="80" font-size="16" font-weight="700">Symbols</text><rect x="40" y="100" width="90" height="34" rx="17" fill="#fff" stroke="#000" stroke-width="2"/><text x="150" y="123" font-size="15">Start / End</text><rect x="40" y="160" width="90" height="34" fill="#fff" stroke="#000" stroke-width="2"/><text x="150" y="183" font-size="15">Process</text><polygon points="85,215 130,240 85,265 40,240" fill="#fff" stroke="#000" stroke-width="2"/><text x="150" y="245" font-size="15">Decision</text><polygon points="52,285 130,285 118,319 40,319" fill="#fff" stroke="#000" stroke-width="2"/><text x="150" y="308" font-size="15">Input / Output</text></svg>